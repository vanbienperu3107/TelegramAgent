name: Do be mat API cua OpenCode

# Deliverable con no cua Milestone 0. Plan (§17.2) ghi 8 endpoint la "?" va cam
# viet Event Processor truoc khi co mau su kien that — vi mot dac ta doan mo se
# keo theo ca §18, §19, §20, §26 va bon AC.
#
# Chay tren runner, SSH vao vpn4, hoi chinh opencode-server dang chay, roi tai
# ket qua ve lam artifact. KHONG chay tren may ca nhan: ket qua phai tai lap
# duoc va phai gan voi mot phien ban image cu the.
on:
  workflow_dispatch:

concurrency:
  group: deploy-vpn4-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hoi opencode-server dang chay
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          VPN4_HOST_KEY_B64: ${{ secrets.VPN4_HOST_KEY_B64 }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST_VPN4: ${{ secrets.SSH_HOST_VPN4 }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          install -m 600 /dev/null k4 && echo "$SSH_KEY" > k4
          install -m 644 /dev/null kh4 && echo "$VPN4_HOST_KEY_B64" | base64 -d > kh4
          SSH4="ssh -p $SSH_PORT -i k4 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=kh4 $SSH_USER@$SSH_HOST_VPN4"
          # Gui script tu runner thay vi dua vao ban tren vpn4: /opt/opencode chi
          # duoc cap nhat khi deploy chay, ma do API la viec doc lap voi deploy.
          scp -P "$SSH_PORT" -i k4 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=kh4 \
            scripts/vpn4/probe-opencode-api.sh "$SSH_USER@$SSH_HOST_VPN4:/tmp/probe-api.sh"
          $SSH4 "bash /tmp/probe-api.sh" > probe.txt 2>&1 || true
          $SSH4 "cat /tmp/opencode-openapi.json" > opencode-openapi.json 2>/dev/null || echo '{}' > opencode-openapi.json
          $SSH4 "cat /tmp/opencode-events.jsonl" > opencode-events.jsonl 2>/dev/null || true

          # Vong hai: chup luong su kien trong luc mot prompt THAT dang chay.
          # Vong mot chi bat duoc `server.connected` vi luc do khong co gi xay ra,
          # ma do moi la thu §17.2 doi: mot luot hoi-dap phat ra su kien nao, theo
          # thu tu nao. Mat khoang 150 giay.
          scp -P "$SSH_PORT" -i k4 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=kh4 \
            scripts/vpn4/probe-opencode-events.sh "$SSH_USER@$SSH_HOST_VPN4:/tmp/probe-events.sh"
          $SSH4 "bash /tmp/probe-events.sh" > probe-events.txt 2>&1 || true
          $SSH4 "cat /tmp/opencode-events-live.jsonl" > opencode-events-live.jsonl 2>/dev/null || true

          # Vong ba: nguoi dung bao "cho xin hinh anh mo ta" -> bot chi tra ve
          # mot cau caption, khong thay gi khac. Do xem message that su chua gi:
          # mot FilePart bi Gateway bo qua, hay chi la van ban hua ho khong co
          # noi dung dinh kem nao ca. Hai gia thuyet doi hai cach sua khac nhau.
          scp -P "$SSH_PORT" -i k4 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=kh4 \
            scripts/vpn4/probe-file-part.sh "$SSH_USER@$SSH_HOST_VPN4:/tmp/probe-file-part.sh"
          $SSH4 "bash /tmp/probe-file-part.sh" > probe-file-part.txt 2>&1 || true

          echo "=== be mat API ===" >> "$GITHUB_STEP_SUMMARY"
          head -c 3000 probe.txt >> "$GITHUB_STEP_SUMMARY"
          echo "=== luong su kien khi chay that ===" >> "$GITHUB_STEP_SUMMARY"
          tail -c 5000 probe-events.txt >> "$GITHUB_STEP_SUMMARY"
          echo "=== hinh anh: message co FilePart khong ===" >> "$GITHUB_STEP_SUMMARY"
          cat probe-file-part.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-api-probe
          path: |
            probe.txt
            opencode-openapi.json
            opencode-events.jsonl
            probe-events.txt
            opencode-events-live.jsonl
            probe-file-part.txt
