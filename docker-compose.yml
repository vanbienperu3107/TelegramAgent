# Stack OpenCode Telegram Remote Gateway — chay tren vpn4 tai /opt/opencode
#
# BAN DINH NGHIA DUY NHAT. Telegram.md §37 mo ta y dinh; file nay la su that.
# Moi bat bien duoi day co mot phep kiem tuong ung trong tests/test_compose.py.
#
# Rang buoc cua may: vpn4 co 1968 MB RAM va dang chay derper (DERP relay cua ca
# fleet). Vi vay MOI service phai co mem_limit + oom_score_adj + logging.

services:
  telegram-gateway:
    image: ghcr.io/vanbienperu3107/opencode-telegram-gateway:${GATEWAY_TAG:?can dat GATEWAY_TAG}
    container_name: opencode-gateway
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 512m
    oom_score_adj: 600
    pids_limit: 256
    env_file: .env
    volumes:
      # CHI DOC. Gateway can doc workspace de gui ve Telegram nhung tep agent tao
      # ra (so do, anh, bao cao) — truoc day agent tao xong thi khong ai gui, va
      # nguoi dung chi thay mot cau noi "da tao xong" ma khong nhan duoc gi.
      #
      # `:ro` la bat buoc: moi thay doi trong workspace phai den tu agent, di qua
      # cua duyet quyen. Gateway ghi duoc la mot duong vong qua cua do.
      - ./workspace:/workspace:ro
    depends_on:
      pg-tunnel:
        condition: service_started
      opencode-server:
        condition: service_healthy
    networks: [opencode_net, db_net]
    # KHONG publish cong: bot chu dong goi ra Telegram bang long polling.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${HEALTH_PORT:?can dat HEALTH_PORT}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  opencode-server:
    image: ghcr.io/vanbienperu3107/opencode-server:${OPENCODE_TAG:?can dat OPENCODE_TAG}
    container_name: opencode-server
    restart: unless-stopped
    # 576m chu khong phai 512m: hai MCP server cuc bo (context7, exa) moi cai la
    # mot tien trinh node rieng, khoang 60-100 MB moi cai. Tran cu du cho OpenCode
    # mot minh nhung khong du cho ca ba.
    #
    # Tong stack thanh 896/900 MB — con 4 MB dem. Do la RAT SAT: bat them mot MCP
    # cuc bo nua (brave dang tat) se phai nang tran tong hoac tat bot cai khac.
    # `oom_score_adj: 800` van giu nguyen y nghia: cham tran thi container nay
    # chet truoc, bot song sot va bao duoc cho nguoi dung.
    mem_limit: 576m
    memswap_limit: 1g
    oom_score_adj: 800
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # HAI FILE ENV RIENG. Dung chung .env se do ca TELEGRAM_BOT_TOKEN va mat khau
    # DB vao container ma agent co quyen `read` — no doc /proc/self/environ la co
    # token bot. .env.opencode chi chua DUNG 2 bien.
    env_file: .env.opencode
    volumes:
      - ./opencode.json:/home/node/.config/opencode/opencode.json:ro
      - ./workspace:/workspace
      # DU LIEU CUA OPENCODE — phien, lich su message, quyen da duyet 'always'.
      #
      # Khong co dong nay thi MOI LAN DEPLOY xoa sach moi phien: buoc 4 chay
      # `up -d --force-recreate opencode-server`, container moi khong con he thong
      # tep cu, va phien tao truoc do bien mat. Bang `opencode_sessions` cua bot
      # van tro toi chung, nen cau hoi tiep theo tra HTTP 404 "Session not found"
      # — dung loi nguoi dung gap ngay 2026-08-18.
      #
      # Quyen bam "cho phep vinh vien" cung nam trong day. Mat no nghia la nguoi
      # dung phai duyet lai tu dau sau moi lan deploy, va loi hua "vinh vien" o
      # nhan nut thanh sai.
      - opencode_data:/home/node/.local/share/opencode
      # Thu muc skill, CHI DOC. Agent khong duoc sua skill cua chinh no: mot lan
      # sua nham la moi phien sau deu chay theo huong dan da hong, va khong ai
      # doi chieu lai voi ban trong git.
      - ./skill_new:/opt/skills:ro
    # Thu muc lam viec cua agent = DUNG thu muc project, khong phai thu muc cha.
    #
    # `POST /session` KHONG co truong thu muc (da doi chieu voi dac ta da tai ve:
    # chi co parentID/title/agent/model/metadata/permission/workspaceID). Phien
    # thua ke `working_dir` cua tien trinh server, nen day la cho DUY NHAT quyet
    # dinh agent lam viec o dau.
    #
    # De `/workspace` thi agent nhin thay `opencode-sandbox/` nhu mot thu muc con
    # va lam viec o tren no mot cap — luc do viec chon project chi la trang tri.
    # Do cung la ly do V1 chi co MOT project: mo project thu hai can them mot
    # container, khong phai chi INSERT mot dong.
    working_dir: ${DEFAULT_PROJECT_PATH:?can dat DEFAULT_PROJECT_PATH}
    # KHONG co "ports:" — bat bien, tests/test_compose.py chan.
    # KHONG o db_net — agent khong duoc thay cong 5433 dan toi Postgres cua headscale.
    networks: [opencode_net, edge]
    healthcheck:
      # `curl -sS` KHONG kem `-f`: no tra 0 cho MOI ma HTTP ke ca 401, chi khac 0
      # khi khong ket noi duoc. Do dung la tin hieu song ma healthcheck can —
      # "server dang lang nghe va tra loi". Con /global/health co doi xac thuc hay
      # khong thi chua do duoc, va tinh dung dan cua xac thuc da co phep thu rieng
      # o buoc 5 cua deploy (goi that mot completion).
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--max-time", "5", "http://127.0.0.1:4096/global/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  pg-tunnel:
    image: ghcr.io/vanbienperu3107/pg-tunnel:${TUNNEL_TAG:?can dat TUNNEL_TAG}
    container_name: opencode-pg-tunnel
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 128m
    oom_score_adj: 400
    pids_limit: 64
    command: >
      autossh -M 0 -N
      -o ServerAliveInterval=15 -o ServerAliveCountMax=3
      -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile=/keys/known_hosts
      -i /keys/pg_tunnel_key
      -L 0.0.0.0:5433:${PG_REMOTE_HOST:?can dat PG_REMOTE_HOST}:5432
      pgtunnel@45.119.87.220
    volumes:
      - ./keys:/keys:ro
    networks: [db_net]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5433"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Ten tuong minh, khong de compose tu dat theo ten thu muc: doi thu muc trien
  # khai la mat het phien.
  opencode_data:
    name: opencode_data

networks:
  opencode_net:
    driver: bridge
  db_net:
    driver: bridge
  edge:
    external: true
